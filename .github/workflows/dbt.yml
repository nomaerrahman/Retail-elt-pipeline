name: dbt build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Extract and load raw data
        run: python ingest/ingest.py

      - name: Build models and run data tests
        run: dbt build --profiles-dir .

      - name: Export marts and charts
        run: python analysis/export_and_charts.py

      - name: Upload charts
        uses: actions/upload-artifact@v4
        with:
          name: charts
          path: docs/*.png
