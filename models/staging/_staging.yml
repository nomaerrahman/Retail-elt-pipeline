version: 2

models:
  - name: stg_transactions
    description: Typed, renamed copy of raw.transactions. No rows removed.
    columns:
      - name: invoice_no
        tests: [not_null]
      - name: stock_code
        tests: [not_null]
      - name: invoiced_at
        tests: [not_null]
      - name: unit_price
        tests: [not_null]
      - name: country
        tests: [not_null]

  - name: int_transactions_flagged
    description: Exact duplicates removed; every row labelled with a quality_status.
    columns:
      - name: line_id
        tests: [unique, not_null]
      - name: quality_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['valid_sale', 'cancellation', 'non_product', 'missing_customer', 'zero_price', 'bad_quantity']
